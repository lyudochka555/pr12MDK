<!doctype html>
<html>
	<head>
		<meta charset = "utf-8">
		<title>svg</title>
		<style>
			svg {
			  border: 1px solid #dddddd;
			}
		</style>
	</head>
	<body>
	<svg width="360" height="500">
		<rect width="320" height="460" x="20" y="20" rx="20" fill="lemonchiffon"/>
		<circle r="100" cx="140" cy="170" fill="crimson"/>
		<ellipse cx="240" cy="210" rx="65" ry="90" fill="gold"/>
		<polygon  points="130,280 140,270 150,280" fill="crimson"/>
        <polygon  points="230,310 240,300 250,310" fill="gold"/>
		<polyline points="140,280 150,300 130,330 150,360 130,390 150,420" stroke="brown" fill="lemonchiffon"/>
		<polyline points="240,310 250,330 230,360 250,390 230,420 250,450" stroke="brown" fill="lemonchiffon"/>
	</svg>
	</body>
</html>
